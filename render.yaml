# Render Blueprint: New > Blueprint, pick this repository.
# Free plan: no persistent disk and the service sleeps after ~15 minutes without traffic.
# Data lives in an external Postgres (e.g. Neon free tier): set DATABASE_URL in the Render dashboard.
# Without DATABASE_URL the app falls back to SQLite, which is wiped on every restart or redeploy.
services:
  - type: web
    name: wayplot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # One worker: realtime updates (SSE) are fanned out in memory. Threads serve concurrent users.
    startCommand: gunicorn -w 1 -k gthread --threads 32 --timeout 0 -b 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /api/destinations
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: WAYPLOT_DEMO
        value: "0"
      - key: WAYPLOT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
