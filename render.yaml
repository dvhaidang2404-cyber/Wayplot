# Render Blueprint: New > Blueprint, pick this repository.
# Free plan: no persistent disk, so the SQLite data resets whenever the service restarts or redeploys,
# and the service sleeps after ~15 minutes without traffic. For lasting data, switch to plan: starter
# and add a disk mounted at /var/data with WAYPLOT_DATA_DIR=/var/data.
services:
  - type: web
    name: wayplot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # One worker: realtime updates (SSE) are fanned out in memory. Threads serve concurrent users.
    startCommand: gunicorn -w 1 -k gthread --threads 32 --timeout 0 -b 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /api/destinations
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: WAYPLOT_DEMO
        value: "0"
      - key: WAYPLOT_SECRET
        generateValue: true
